: 1})),("b_thuluth","RAW",("brush.apply",{"ids": ["$PATH"], "name": "Thuluth Qalam / قلم الثلث"})),("p_diwani","RAW",("path.create",{"d": "M60 690 C110 672 150 708 200 690 S 270 678 300 690 L 330 704"})),("s_diwani","RAW",("paint.setStroke",{"ids": ["$LAST"], "color": "#111111", "width": 1})),("b_diwani","RAW",("brush.apply",{"ids": ["$PATH"], "name": "Diwani Qalam / قلم الديواني"})),("p_ruqaa","RAW",("path.create",{"d": "M60 720 C110 702 150 738 200 720 S 270 708 300 720 L 330 734"})),("s_ruqaa","RAW",("paint.setStroke",{"ids": ["$LAST"], "color": "#111111", "width": 1})),("b_ruqaa","RAW",("brush.apply",{"ids": ["$PATH"], "name": "Ruqaa Qalam / قلم الرقعة"})),("p_kufi","RAW",("path.create",{"d": "M60 750 C110 732 150 768 200 750 S 270 738 300 750 L 330 764"})),("s_kufi","RAW",("paint.setStroke",{"ids": ["$LAST"], "color": "#111111", "width": 1})),("b_kufi","RAW",("brush.apply",{"ids": ["$PATH"], "name": "Kufi Qalam / قلم الكوفي"})),("wait10",None,None),("shot8","ui.screenshot",{"path":"shots/arabic-typo.png"}),("render","RAW",("ui.render",{"path":"shots/artboard-x4.png","scale":4})),("about","INV",("help.about",{})),("wait6",None,None),("shot5","ui.screenshot",{"path":"shots/arabic-about.png"}),("inspect","ui.inspect",{}),("cancelabout","RAW",("ui.dialog.cancel",{})),("wait9",None,None),("find","RAW",("ui.find",{"name":"EN"})),("click","RAW",("ui.click",{"x":485,"y":13})),("wait8",None,None),("shot7","ui.screenshot",{"path":"shots/clicked-en.png"})]:
              if m is None: time.sleep(5); continue
              if m=="LANG":
                  for mm in ("ui.menu.invoke","command","engine.execute"):
                      try: r=call(mm,{"command":"app.language","params":{"lang":"ar"}})
                      except Exception as e: r={"exception":str(e)}
                      log.write("lang via "+mm+": "+json.dumps(r)[:600]+"\n")
                      if r.get("ok"): break
                  continue
              if m=="RAW":
                  pj=json.dumps(p[1]).replace('"$LAST"',str(last.get("id"))).replace('"$PATH"',str(last.get("path")))
                  try: r=call("engine.execute",{"command":p[0],"params":json.loads(pj)}) if p[0].split(".")[0] in ("text","path","paint","brush") else call(p[0],json.loads(pj))
                  except Exception as e: r={"exception":str(e)}
                  try:
                      rr=r.get("result") or {}
                      if isinstance(rr,dict) and "id" in rr:
                          last["id"]=rr["id"]
                          if p[0]=="path.create": last["path"]=rr["id"]
                  except Exception: pass
                  log.write(name+": "+json.dumps(r)[:900]+"\n")
                  continue
              if m=="INV":
                  try: r=call("ui.menu.invoke",{"command":p[0],"params":p[1]})
                  except Exception as e: r={"exception":str(e)}
                  log.write(name+": "+json.dumps(r)[:600]+"\n")
                  continue
              if m=="LIGHT":
                  try: r=call("ui.menu.invoke",{"command":"window.brightness","params":{"brightness":"light"}})
                  except Exception as e: r={"exception":str(e)}
                  log.write("light: "+json.dumps(r)[:600]+"\n")
                  continue
              try: r=call(m,p)
              except Exception as e: r={"exception":str(e)}
              log.write(name+": "+json.dumps(r)[:3000]+"\n")
