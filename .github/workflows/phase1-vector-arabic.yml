name: phase1-vector-arabic
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/phase1-vector-arabic.yml', 'upstream/vectorcraft/**', 'upstream/craft-i18n/**']
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360
    defaults:
      run:
        working-directory: upstream/vectorcraft
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            upstream/vectorcraft/target
          key: vectorcraft-${{ hashFiles('upstream/vectorcraft/Cargo.lock') }}
      - name: Build (release)
        env:
          CRAFT_I18N_DIR: ${{ github.workspace }}/upstream/craft-i18n
        run: cargo build --release -p vectorcraft
      - name: Arabic UI screenshot (real window, control channel)
        continue-on-error: true
        env:
          VECTORCRAFT_CONFIG_DIR: ${{ runner.temp }}/vcfg
        run: |
          mkdir -p shots
          ./target/release/vectorcraft.exe --control 7979 > shots/app.log 2>&1 &
          sleep 25
          python - <<'PY'
          import socket, json, time, base64, re
          tok=re.search(r"control token: (\S+)", open("shots/app.log").read()).group(1)
          sock=socket.create_connection(("127.0.0.1",7979),timeout=120)
          rf=sock.makefile("rb")
          n=[0]
          def call(m, p=None):
              n[0]+=1
              sock.sendall((json.dumps({"id":n[0],"method":m,"params":p or {}})+"\n").encode())
              return json.loads(rf.readline())
          log0=call("auth",{"token":tok})
          log=open("shots/steps.log","w")
          log.write("auth: "+json.dumps(log0)+"\n")
          for name,m,p in [("lang","LANG",None),("wait",None,None),("shot0","ui.screenshot",{"path":"shots/before.png"}),("wait2",None,None),("shot","ui.screenshot",{"path":"shots/arabic-ui.png"}),("light","LIGHT",None),("wait3",None,None),("shot2","ui.screenshot",{"path":"shots/arabic-light.png"}),("new","INV",("file.new",{})),("wait4",None,None),("shot3","ui.screenshot",{"path":"shots/arabic-newdoc.png"}),("tool1","RAW",("ui.tool.select",{"tool":"rectangle"})),("rect","RAW",("ui.pointer",{"events":[{"kind":"down","x":100,"y":100,"space":"doc"},{"kind":"drag","x":300,"y":220,"space":"doc"},{"kind":"up","x":300,"y":220,"space":"doc"}]})),("tool2","RAW",("ui.tool.select",{"tool":"type"})),("tdown","RAW",("ui.pointer",{"events":[{"kind":"down","x":120,"y":320,"space":"doc"},{"kind":"up","x":120,"y":320,"space":"doc"}]})),("typ","RAW",("ui.type",{"text":"مَرْحَباً بِكُمْ فِي نَقْشٍ — الــــــخط"})),("tesc","RAW",("ui.key",{"key":"Escape"})),("wait7",None,None),("shot6","ui.screenshot",{"path":"shots/arabic-draw.png"}),("render","RAW",("ui.render",{"path":"shots/artboard-x4.png","scale":4})),("about","INV",("help.about",{})),("wait6",None,None),("shot5","ui.screenshot",{"path":"shots/arabic-about.png"}),("inspect","ui.inspect",{}),("cancelabout","RAW",("ui.dialog.cancel",{})),("wait9",None,None),("find","RAW",("ui.find",{"name":"EN"})),("click","RAW",("ui.click",{"x":485,"y":13})),("wait8",None,None),("shot7","ui.screenshot",{"path":"shots/clicked-en.png"})]:
              if m is None: time.sleep(5); continue
              if m=="LANG":
                  for mm in ("ui.menu.invoke","command","engine.execute"):
                      try: r=call(mm,{"command":"app.language","params":{"lang":"ar"}})
                      except Exception as e: r={"exception":str(e)}
                      log.write("lang via "+mm+": "+json.dumps(r)[:600]+"\n")
                      if r.get("ok"): break
                  continue
              if m=="RAW":
                  try: r=call(p[0],p[1])
                  except Exception as e: r={"exception":str(e)}
                  log.write(name+": "+json.dumps(r)[:900]+"\n")
                  continue
              if m=="INV":
                  try: r=call("ui.menu.invoke",{"command":p[0],"params":p[1]})
                  except Exception as e: r={"exception":str(e)}
                  log.write(name+": "+json.dumps(r)[:600]+"\n")
                  continue
              if m=="LIGHT":
                  try: r=call("ui.menu.invoke",{"command":"window.brightness","params":{"brightness":"light"}})
                  except Exception as e: r={"exception":str(e)}
                  log.write("light: "+json.dumps(r)[:600]+"\n")
                  continue
              try: r=call(m,p)
              except Exception as e: r={"exception":str(e)}
              log.write(name+": "+json.dumps(r)[:3000]+"\n")
          PY
          cat shots/steps.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vectorcraft-arabic-shots
          path: upstream/vectorcraft/shots
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: naqsh-vector-windows-x64
          path: upstream/vectorcraft/target/release/vectorcraft.exe
