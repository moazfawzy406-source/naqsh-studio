name: phase1-vector-arabic
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/phase1-vector-arabic.yml', 'upstream/vectorcraft/**', 'upstream/craft-i18n/**']
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360
    defaults:
      run:
        working-directory: upstream/vectorcraft
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            upstream/vectorcraft/target
          key: vectorcraft-${{ hashFiles('upstream/vectorcraft/Cargo.lock') }}
      - name: Build (release)
        env:
          CRAFT_I18N_DIR: ${{ github.workspace }}/upstream/craft-i18n
        run: cargo build --release -p vectorcraft
      - name: Arabic UI screenshot (real window, control channel)
        continue-on-error: true
        env:
          VECTORCRAFT_CONFIG_DIR: ${{ runner.temp }}/vcfg
        run: |
          mkdir -p shots
          ./target/release/vectorcraft.exe --control 7979 > shots/app.log 2>&1 &
          sleep 25
          python - <<'PY'
          import socket, json, time, base64, re
          tok=re.search(r"control token: (\S+)", open("shots/app.log").read()).group(1)
          sock=socket.create_connection(("127.0.0.1",7979),timeout=120)
          rf=sock.makefile("rb")
          n=[0]
          def call(m, p=None):
              n[0]+=1
              sock.sendall((json.dumps({"id":n[0],"method":m,"params":p or {}})+"\n").encode())
              return json.loads(rf.readline())
          log0=call("auth",{"token":tok})
          log=open("shots/steps.log","w")
          last={}
          log.write("auth: "+json.dumps(log0)+"\n")
          for name,m,p in [("lang","LANG",None),("wait",None,None),("shot0","ui.screenshot",{"path":"shots/before.png"}),("wait2",None,None),("shot","ui.screenshot",{"path":"shots/arabic-ui.png"}),("light","LIGHT",None),("wait3",None,None),("shot2","ui.screenshot",{"path":"shots/arabic-light.png"}),("mc_file","RAW",("ui.click",{"x":942,"y":16})),("mw_file",None,None),("ms_file","ui.screenshot",{"path":"shots/menu-file.png"}),("mk_file","RAW",("ui.key",{"key":"Escape"})),("mc_edit","RAW",("ui.click",{"x":904,"y":16})),("mw_edit",None,None),("ms_edit","ui.screenshot",{"path":"shots/menu-edit.png"}),("mk_edit","RAW",("ui.key",{"key":"Escape"})),("mc_object","RAW",("ui.click",{"x":867,"y":16})),("mw_object",None,None),("ms_object","ui.screenshot",{"path":"shots/menu-object.png"}),("mk_object","RAW",("ui.key",{"key":"Escape"})),("mc_type","RAW",("ui.click",{"x":835,"y":16})),("mw_type",None,None),("ms_type","ui.screenshot",{"path":"shots/menu-type.png"}),("mk_type","RAW",("ui.key",{"key":"Escape"})),("mc_select","RAW",("ui.click",{"x":795,"y":16})),("mw_select",None,None),("ms_select","ui.screenshot",{"path":"shots/menu-select.png"}),("mk_select","RAW",("ui.key",{"key":"Escape"})),("mc_effect","RAW",("ui.click",{"x":757,"y":16})),("mw_effect",None,None),("ms_effect","ui.screenshot",{"path":"shots/menu-effect.png"}),("mk_effect","RAW",("ui.key",{"key":"Escape"})),("mc_view","RAW",("ui.click",{"x":722,"y":16})),("mw_view",None,None),("ms_view","ui.screenshot",{"path":"shots/menu-view.png"}),("mk_view","RAW",("ui.key",{"key":"Escape"})),("mc_window","RAW",("ui.click",{"x":686,"y":16})),("mw_window",None,None),("ms_window","ui.screenshot",{"path":"shots/menu-window.png"}),("mk_window","RAW",("ui.key",{"key":"Escape"})),("mc_help","RAW",("ui.click",{"x":642,"y":16})),("mw_help",None,None),("ms_help","ui.screenshot",{"path":"shots/menu-help.png"}),("mk_help","RAW",("ui.key",{"key":"Escape"})),("new","INV",("file.new",{})),("wait4",None,None),("shot3","ui.screenshot",{"path":"s