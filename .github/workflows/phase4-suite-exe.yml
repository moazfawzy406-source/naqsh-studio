name: phase4-suite-exe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/phase4-suite-exe.yml', 'studio/**']
jobs:
  exe:
    runs-on: windows-latest
    timeout-minutes: 360
    defaults:
      run:
        working-directory: studio
        shell: bash
    env:
      CRAFT_I18N_DIR: ${{ github.workspace }}/upstream/craft-i18n
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: mozilla-actions/sccache-action@v0.0.9
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: suite-reg-${{ hashFiles('studio/Cargo.toml', 'studio/suite/Cargo.toml') }}
      - name: Build naqsh-studio.exe (release, all four apps)
        run: cargo build --release -p naqsh-suite --bin naqsh-studio
      - name: sccache stats
        run: sccache --show-stats || true
      - name: Launch test (Vector hub click opens Deck, then each app alone)
        continue-on-error: true
        env:
          VECTORCRAFT_CONFIG_DIR: ${{ runner.temp }}/vcfg
        run: |
          pip install pillow
          mkdir -p ../shots shots
          NAQSH_APP=vector ./target/release/naqsh-studio.exe --control 7979 > ../shots/vector.log 2>&1 &
          sleep 30
          python - <<'PY'
          import socket, json, time, re
          from PIL import ImageGrab
          tok=re.search(r"control token: (\S+)", open("../shots/vector.log").read()).group(1)
          sock=socket.create_connection(("127.0.0.1",7979),timeout=120); rf=sock.makefile("rb"); n=[0]
          def call(m,p=None):
              n[0]+=1; sock.sendall((json.dumps({"id":n[0],"method":m,"params":p or {}})+"\n").encode()); return json.loads(rf.readline())
          log=open("../shots/hub.log","w")
          log.write(json.dumps(call("auth",{"token":tok}))+"\n")
          log.write(json.dumps(call("ui.menu.invoke",{"command":"app.language","params":{"lang":"ar"}}))+"\n")
          time.sleep(3)
          call("ui.screenshot",{"path":"shots/hub-arabic.png"})
          try:
              log.write(json.dumps(call("ui.menu.invoke",{"command":"window.panel","params":{"panel":"brushes"}}))+"\n")
              time.sleep(3)
              call("ui.screenshot",{"path":"shots/brushes-panel.png"})
          except Exception as e:
              log.write("brushes step failed: "+str(e)+"\n")
          r=call("ui.find",{"name":"فتح التخطيط"}); log.write(json.dumps(r)+"\n")
          rc=r["result"]["rect"]
          log.write(json.dumps(call("ui.click",{"x":rc[0]+rc[2]/2,"y":rc[1]+rc[3]/2}))+"\n")
          time.sleep(40)
          ImageGrab.grab().save("../shots/after-click-layout-arabic.png")
          try:
              log.write(json.dumps(call("ui.menu.invoke",{"command":"app.language","params":{"lang":"en"}}))+"\n")
              time.sleep(3)
              call("ui.screenshot",{"path":"shots/hub-english.png"})
          except Exception as e:
              log.write("english step failed: "+str(e)+"\n")
          try:
              log.write(json.dumps(call("ui.menu.invoke",{"command":"window.brightness","params":{"brightness":"dark"}}))+"\n")
              time.sleep(3)
              r=call("ui.find",{"name":"Open Deck"}); log.write(json.dumps(r)+"\n")
              rc=r["result"]["rect"]
              log.write(json.dumps(call("ui.click",{"x":rc[0]+rc[2]/2,"y":rc[1]+rc[3]/2}))+"\n")
              time.sleep(40)
              ImageGrab.grab().save("../shots/after-click-deck.png")
          except Exception as e:
              log.write("deck step failed: "+str(e)+"\n")
          log.close()
          PY
          cp shots/*.png ../shots/ || true
          tasklist | grep -i naqsh-studio >> ../shots/summary.txt || true
          taskkill //F //IM naqsh-studio.exe || true
          sleep 3
          for app in deck layout photo; do
            NAQSH_LANG=ar NAQSH_APP=$app ./target/release/naqsh-studio.exe > ../shots/$app.log 2>&1 &
            sleep 40
            python -c "from PIL import ImageGrab; ImageGrab.grab().save('../shots/$app.png')"
            taskkill //F //IM naqsh-studio.exe || true
            sleep 3
          done
          NAQSH_LANG=ar NAQSH_APP=deck ./target/release/naqsh-studio.exe --sample > ../shots/deck-sample.log 2>&1 &
          sleep 40
          python -c "from PIL import ImageGrab; ImageGrab.grab().save('../shots/deck-sample.png')"
          taskkill //F //IM naqsh-studio.exe || true
          NAQSH_THEME=dark NAQSH_LANG=ar NAQSH_APP=deck ./target/release/naqsh-studio.exe --sample > ../shots/deck-dark.log 2>&1 &
          sleep 40
          python -c "from PIL import ImageGrab; ImageGrab.grab().save('../shots/deck-dark.png')"
          taskkill //F //IM naqsh-studio.exe || true
          NAQSH_THEME=light NAQSH_LANG=ar NAQSH_APP=layout ./target/release/naqsh-studio.exe > ../shots/layout-light.log 2>&1 &
          sleep 40
          python -c "from PIL import ImageGrab; ImageGrab.grab().save('../shots/layout-light.png')"
          taskkill //F //IM naqsh-studio.exe || true
          NAQSH_LANG=ar NAQSH_APP=vector ./target/release/naqsh-studio.exe --control 7980 > ../shots/vector2.log 2>&1 &
          sleep 30
          python - <<'PY'
          import socket, json, time, re
          tok=re.search(r"control token: (\S+)", open("../shots/vector2.log").read()).group(1)
          sock=socket.create_connection(("127.0.0.1",7980),timeout=120); rf=sock.makefile("rb"); n=[0]
          def call(m,p=None):
              n[0]+=1; sock.sendall((json.dumps({"id":n[0],"method":m,"params":p or {}})+"\n").encode()); return json.loads(rf.readline())
          log=open("../shots/brushes.log","w")
          log.write(json.dumps(call("auth",{"token":tok}))+"\n")
          log.write(json.dumps(call("ui.menu.invoke",{"command":"file.new","params":{"width":600,"height":400}}))+"\n")
          time.sleep(3)
          log.write(json.dumps(call("ui.menu.invoke",{"command":"window.panel","params":{"panel":"brushes"}}))+"\n")
          time.sleep(3)
          call("ui.screenshot",{"path":"../shots/brushes-doc.png"})
          log.close()
          PY
          taskkill //F //IM naqsh-studio.exe || true
          cat ../shots/summary.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: suite-shots
          path: shots/
      - uses: actions/upload-artifact@v4
        with:
          name: naqsh-studio-windows-x64
          path: studio/target/release/naqsh-studio.exe
