[package]
name = "naqsh-suite"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "naqsh-studio"
path = "src/main.rs"

[dependencies]
vectorcraft = { path = "../../upstream/vectorcraft/apps/vectorcraft" }
deckcraft = { path = "../../upstream/deckcraft/apps/deckcraft" }
designcraft = { path = "../../upstream/designcraft/apps/designcraft" }
photocraft = { path = "../../upstream/photocraft/apps/photocraft" }
deckcraft-ui-egui = { path = "../../upstream/deckcraft/crates/ui-egui" }
deckcraft-engine = { path = "../../upstream/deckcraft/crates/engine" }
designcraft-ui-egui = { path = "../../upstream/designcraft/crates/ui-egui" }
designcraft-engine = { path = "../../upstream/designcraft/crates/engine" }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11"] }
egui = { version = "0.37", default-features = false }
vectorcraft-ui-egui = { path = "../../upstream/vectorcraft/crates/ui-egui" }
vectorcraft-engine = { path = "../../upstream/vectorcraft/crates/engine" }
photocraft-ui-egui = { path = "../../upstream/photocraft/crates/ui-egui" }
photocraft-engine = { path = "../../upstream/photocraft/crates/engine" }
